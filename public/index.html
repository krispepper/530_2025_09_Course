<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Course Evaluation Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="header">
        <div class="header-title">Course Evaluation Portal</div>

        <div class="header-user">
          <span id="header-user">Not signed in</span>
          <button id="logout-btn" class="logout-btn hidden">Logout</button>
        </div>
      </header>

      <div class="app-body">
        <aside class="sidebar">
          <nav class="nav">
            <a href="/dashboard" data-link class="nav-link">Dashboard</a>
            <a href="/evaluate" data-link class="nav-link">Evaluation Form</a>
            <a href="/admin/reports" data-link class="nav-link hidden">Admin Reports</a>
            <a href="/admin/enrollment" data-link class="nav-link hidden">Enroll Students</a>
            <a href="/instructor/courses" data-link class="nav-link">My Courses</a>
          </nav>
        </aside>

        <main id="app-content" class="app-content"></main>
      </div>
    </div>

    <div id="toast-root"></div>
    <div id="modal-root"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
